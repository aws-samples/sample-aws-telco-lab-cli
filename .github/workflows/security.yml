name: Security Scan

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install 'setuptools>=78.1.1'
          pip install 'bandit[toml]==1.7.9' 'pip-audit==2.7.3'
          pip install -e .
      
      - name: Run bandit security scan (high severity only)
        run: |
          # JSON report includes all severities; bandit exits 1 if any finding exists.
          # --exit-zero keeps this step green so artifacts upload; -lll enforces the real gate.
          bandit -r src -f json -o bandit-report.json --exit-zero
          bandit -r src -lll
      
      # pip-audit runs on Python 3.9 to match telcocli's minimum. Several fixes require
      # Python >=3.10 (requests 2.33+, filelock 3.20+, pip 26.1+) or urllib3 2.x (blocked
      # on 3.9 by botocore's urllib3<1.27). Ignores are documented in SECURITY.md; remove
      # when requires-python is raised or upstream constraints change.
      - name: Run dependency vulnerability scan
        run: |
          pip-audit \
            --format=json \
            --output=pip-audit-report.json \
            --ignore-vuln GHSA-w853-jp5j-5j7f \
            --ignore-vuln GHSA-qmgc-5h2g-mvrw \
            --ignore-vuln GHSA-58qw-9mgm-455v \
            --ignore-vuln GHSA-gc5v-m9x4-r6x2 \
            --ignore-vuln GHSA-pq67-6m6q-mj2v \
            --ignore-vuln GHSA-gm62-xv2j-4w53 \
            --ignore-vuln GHSA-2xpw-w6gg-jr37 \
            --ignore-vuln GHSA-38jv-5279-wg99
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
