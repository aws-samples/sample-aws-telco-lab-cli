name: Release

# Runs only after the CI workflow completes successfully for a `v*` tag push.
# GitHub fills in the release body (commits + merged PRs since the previous release).
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.repository == 'aws-samples/sample-aws-telco-lab-cli' &&
      github.event.workflow_run.head_repository.full_name == 'aws-samples/sample-aws-telco-lab-cli' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      contains(github.event.workflow_run.head_branch, '.')
    runs-on: ubuntu-latest
    steps:
      - name: Guard trusted repository
        run: |
          if [ "${{ github.repository }}" != "aws-samples/sample-aws-telco-lab-cli" ]; then
            echo "::error::Release publishing is only allowed from aws-samples/sample-aws-telco-lab-cli."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install 'setuptools>=78.1.1'
          pip install 'build==1.2.2.post1' 'twine==6.1.0'

      - name: Verify package version matches tag
        env:
          TAG_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match pyproject version ${PKG_VERSION}."
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Ensure PyPI token exists
        run: |
          if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "::error::Missing required repository secret: PYPI_API_TOKEN."
            echo "::error::Set PYPI_API_TOKEN before creating release tags."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          name: ${{ github.event.workflow_run.head_branch }}
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
