name: Release

# Tag push gives a reliable ref (github.ref_name). We then wait for the CI workflow to
# succeed on the same commit — avoids workflow_run head_branch / listTags edge cases that
# skipped the release job.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.repository == 'aws-samples/sample-aws-telco-lab-cli' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    steps:
      - name: Guard trusted repository
        run: |
          if [ "${{ github.repository }}" != "aws-samples/sample-aws-telco-lab-cli" ]; then
            echo "::error::Release publishing is only allowed from aws-samples/sample-aws-telco-lab-cli."
            exit 1
          fi

      - name: Wait for CI workflow to succeed on this tag
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            let attempts = 0;
            const maxAttempts = 30;
            const sleepMs = 10000;
            let ciSuccess = false;
            let failureReason = "";

            while (attempts < maxAttempts) {
              attempts += 1;
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "ci.yml",
                event: "push",
                per_page: 50,
              });

              const matching = runs.data.workflow_runs.find((run) => run.head_sha === sha);
              if (matching) {
                if (matching.status === "completed") {
                  if (matching.conclusion === "success") {
                    ciSuccess = true;
                    core.info(`CI run ${matching.id} completed successfully.`);
                  } else {
                    failureReason = `CI run ${matching.id} concluded with ${matching.conclusion}.`;
                  }
                  break;
                }

                core.info(
                  `Found CI run ${matching.id} for ${sha} with status ${matching.status} (attempt ${attempts}/${maxAttempts})...`,
                );
              } else {
                core.info(`No CI run found yet for ${sha} (attempt ${attempts}/${maxAttempts})...`);
              }

              await new Promise((resolve) => setTimeout(resolve, sleepMs));
            }

            if (failureReason) {
              core.setFailed(failureReason);
            } else if (!ciSuccess) {
              core.setFailed("Timed out waiting for a successful CI run for this tag SHA.");
            }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install 'setuptools>=78.1.1'
          pip install 'build==1.2.2.post1' 'twine==6.1.0'

      - name: Verify package version matches tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match pyproject version ${PKG_VERSION}."
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Ensure PyPI token exists
        run: |
          if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "::error::Missing required repository secret: PYPI_API_TOKEN."
            echo "::error::Set PYPI_API_TOKEN before creating release tags."
            exit 1
          fi

      - name: Prepare release notes prefix (first GA v1.0.0)
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "v1.0.0" ]; then
            cp docs/first-official-release.md release-body-prefix.md
          else
            echo "## ${TAG}" > release-body-prefix.md
            echo "" >> release-body-prefix.md
            echo "See **What’s Changed** below for commits and merged pull requests." >> release-body-prefix.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body-prefix.md
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
