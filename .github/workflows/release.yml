name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Guard trusted repository
        run: |
          if [ "${{ github.repository }}" != "aws-samples/sample-aws-telco-lab-cli" ]; then
            echo "::error::Release publishing is only allowed from aws-samples/sample-aws-telco-lab-cli."
            exit 1
          fi

      - name: Verify CI workflow succeeded for this tag
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            let attempts = 0;
            const maxAttempts = 20;
            const sleepMs = 15000;
            let ciSuccess = false;
            let failureReason = "";

            while (attempts < maxAttempts) {
              attempts += 1;
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "ci.yml",
                event: "push",
                per_page: 50,
              });

              const matching = runs.data.workflow_runs.find((run) => run.head_sha === sha);
              if (matching) {
                if (matching.status === "completed") {
                  if (matching.conclusion === "success") {
                    ciSuccess = true;
                    core.info(`CI run ${matching.id} completed successfully.`);
                  } else {
                    failureReason = `CI run ${matching.id} concluded with ${matching.conclusion}.`;
                  }
                  break;
                }

                core.info(
                  `Found CI run ${matching.id} for ${sha} with status ${matching.status} (attempt ${attempts}/${maxAttempts})...`,
                );
              } else {
                core.info(`No CI run found yet for ${sha} (attempt ${attempts}/${maxAttempts})...`);
              }

              await new Promise((resolve) => setTimeout(resolve, sleepMs));
            }

            if (failureReason) {
              core.setFailed(failureReason);
            } else if (!ciSuccess) {
              core.setFailed("Timed out waiting for a successful CI run for this tag SHA.");
            }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install 'setuptools>=78.1.1'
          pip install 'build==1.2.2.post1' 'twine==6.1.0'

      - name: Verify package version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${PKG_VERSION}."
            exit 1
          fi
      
      - name: Build package
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
      
      - name: Ensure PyPI token exists
        run: |
          if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "::error::Missing required repository secret: PYPI_API_TOKEN."
            echo "::error::Set PYPI_API_TOKEN before creating release tags."
            exit 1
          fi

      - name: Publish to PyPI
        if: github.repository == 'aws-samples/sample-aws-telco-lab-cli' && startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
