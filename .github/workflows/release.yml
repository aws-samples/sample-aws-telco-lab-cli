name: Release

# Runs after CI succeeds for a semver tag push. Resolves the tag from the commit if
# workflow_run.head_branch is empty (common), so the job is not skipped.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve v* tag for this CI run
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const wr = context.payload.workflow_run;

            if (wr.conclusion !== "success" || wr.event !== "push") {
              core.info("Skipping: workflow_run not a successful push.");
              core.setOutput("tag", "");
              return;
            }
            if (`${owner}/${repo}` !== "aws-samples/sample-aws-telco-lab-cli") {
              core.info("Skipping: not aws-samples/sample-aws-telco-lab-cli.");
              core.setOutput("tag", "");
              return;
            }
            if (wr.head_repository.full_name !== "aws-samples/sample-aws-telco-lab-cli") {
              core.info("Skipping: head_repository is not trusted.");
              core.setOutput("tag", "");
              return;
            }

            const sha = wr.head_sha;
            const hb = wr.head_branch || "";
            let tag = "";

            if (hb.startsWith("v") && hb.includes(".")) {
              tag = hb;
              core.info(`Using head_branch as tag: ${tag}`);
            } else {
              const tags = await github.paginate(github.rest.repos.listTags, {
                owner,
                repo,
                per_page: 100,
              });
              const hits = tags.filter(
                (t) => t.commit.sha === sha && t.name.startsWith("v") && t.name.includes("."),
              );
              if (hits.length === 1) {
                tag = hits[0].name;
              } else if (hits.length > 1) {
                hits.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
                tag = hits[hits.length - 1].name;
                core.warning(`Multiple v* tags on ${sha}; using ${tag}`);
              } else {
                core.info(`No v* tag found at ${sha} (head_branch was "${hb}").`);
              }
            }

            core.setOutput("tag", tag);

  release:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Guard trusted repository
        run: |
          if [ "${{ github.repository }}" != "aws-samples/sample-aws-telco-lab-cli" ]; then
            echo "::error::Release publishing is only allowed from aws-samples/sample-aws-telco-lab-cli."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install 'setuptools>=78.1.1'
          pip install 'build==1.2.2.post1' 'twine==6.1.0'

      - name: Verify package version matches tag
        env:
          TAG_NAME: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match pyproject version ${PKG_VERSION}."
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Ensure PyPI token exists
        run: |
          if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "::error::Missing required repository secret: PYPI_API_TOKEN."
            echo "::error::Set PYPI_API_TOKEN before creating release tags."
            exit 1
          fi

      - name: Prepare release notes prefix (first GA v1.0.0)
        run: |
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          if [ "$TAG" = "v1.0.0" ]; then
            cp docs/first-official-release.md release-body-prefix.md
          else
            echo "## ${TAG}" > release-body-prefix.md
            echo "" >> release-body-prefix.md
            echo "See **What’s Changed** below for commits and merged pull requests." >> release-body-prefix.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: ${{ needs.resolve-tag.outputs.tag }}
          body_path: release-body-prefix.md
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
