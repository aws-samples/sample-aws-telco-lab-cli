name: CI

on:
  push:
    branches: [ main, open-source-v1 ]
  pull_request:
    branches: [ main, open-source-v1 ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 mypy bandit safety
          pip install -e .
      
      - name: Lint with black
        run: black --check --line-length 100 src test
      
      - name: Check imports with isort
        run: isort --check-only --profile black --line-length 100 src test
      
      - name: Lint with flake8
        run: flake8 src test --max-line-length=100 --ignore=E203,W503,E501
      
      - name: Type check with mypy
        run: mypy src --ignore-missing-imports --check-untyped-defs
      
      - name: Run tests with coverage
        run: pytest --cov=telco_cli --cov-report=xml --cov-report=term-missing
      
      - name: Security scan with bandit
        run: bandit -r src || true
        continue-on-error: true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.9'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install build tools
        run: pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Check package
        run: twine check dist/*
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
