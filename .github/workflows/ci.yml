name: CI
# Smoke: confirms Actions runs on push to main (safe to remove after verification).

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      STRICT_RELEASE_PATH: ${{ (github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install 'setuptools>=78.1.1'
          pip install 'black==26.3.1' 'isort==5.13.2' 'flake8==7.1.1' 'mypy==1.14.1' 'bandit[toml]==1.7.9'
          pip install -e ".[test,mcp]"
      
      - name: Lint with black
        run: |
          echo "Running black..."
          black --check --target-version py39 --line-length 100 src test
      
      - name: Check imports with isort
        run: |
          echo "Running isort..."
          isort --check-only --profile black --line-length 100 src test
      
      - name: Lint with flake8
        run: |
          echo "Running flake8..."
          flake8 src test --max-line-length=100 --ignore=E203,W503,E501
      
      - name: Type check with mypy
        run: |
          echo "Running mypy..."
          if [ "${STRICT_RELEASE_PATH}" = "true" ]; then
            mypy src --ignore-missing-imports --check-untyped-defs
          else
            mypy src --ignore-missing-imports --check-untyped-defs || echo "Type check has warnings, continuing..."
          fi
        continue-on-error: ${{ env.STRICT_RELEASE_PATH != 'true' }}
      
      - name: Run tests with coverage
        run: |
          echo "Python version:"
          python --version
          echo "Pytest version:"
          pytest --version
          echo "Running tests..."
          pytest test/ --cov=telco_cli --cov-report=xml --cov-report=term-missing -v
      
      - name: Security scan with bandit
        run: |
          if [ "${STRICT_RELEASE_PATH}" = "true" ]; then
            bandit -r src -lll
          else
            bandit -r src -lll || true
          fi
        continue-on-error: ${{ env.STRICT_RELEASE_PATH != 'true' }}
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.9'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
      
      - name: Notify Slack on success
        if: success() && matrix.python-version == '3.11' && github.event_name == 'push'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ CI Pipeline Passed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*CI Passed*\n*Repository:* ${{ github.repository }}\n*Branch:* `${{ github.ref_name }}`\n*Commit:* <${{ github.event.head_commit.url }}|${{ github.sha }}>\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Notify Slack on failure
        if: failure() && matrix.python-version == '3.11' && github.event_name == 'push'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ CI Pipeline Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*CI Failed*\n*Repository:* ${{ github.repository }}\n*Branch:* `${{ github.ref_name }}`\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install 'setuptools>=78.1.1'
          pip install 'build==1.2.2.post1' 'twine==6.1.0'
      
      - name: Build package
        run: python -m build
      
      - name: Check package
        run: twine check dist/*

      - name: Wheel install smoke test
        run: |
          python -m venv .smoke-venv
          . .smoke-venv/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
          telcocli --help
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
