name: CI

on:
  push:
    branches: [ main, open-source-v1 ]
  pull_request:
    branches: [ main, open-source-v1 ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install black isort flake8
          pip install -r requirements.txt
          pip install -e .
      
      - name: Check formatting with black
        run: black --check --line-length 100 src test
      
      - name: Check import sorting with isort
        run: isort --check-only --profile black --line-length 100 src test
      
      - name: Lint with flake8
        run: flake8 src test --max-line-length=100 --ignore=E203,W503,E501

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install mypy
          pip install -r requirements.txt
          pip install -e .
      
      - name: Type check with mypy
        run: mypy src --ignore-missing-imports --check-untyped-defs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      
      - name: Run tests with coverage
        run: pytest --cov=telco_cli --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install bandit safety
          pip install -r requirements.txt
          pip install -e .
      
      - name: Security scan with bandit
        run: bandit -r src -f json -o bandit-report.json || true
      
      - name: Check dependencies with safety
        run: safety check --json || true

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install build tools
        run: pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Check package
        run: twine check dist/*
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
